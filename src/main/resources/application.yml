spring:
  application:
    name: chat-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:chat;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE:false}

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
